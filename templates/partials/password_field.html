{% load wms i18n %}{# A password field with a show/hide eye. Needs `:type` on the widget (see forms.py). #}
<div class="{% if field.errors %}has-error{% endif %}" x-data="{ show: false }">
  <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="font-normal text-muted">{% translate "(ixtiyoriy)" %}</span>{% endif %}</label>
  <div class="relative">
    {{ field }}
    <button type="button" @click="show = !show"
            class="absolute right-0 top-0 flex h-full w-11 items-center justify-center text-muted hover:text-ink"
            :aria-label="show ? '{% translate "Parolni yashirish" %}' : '{% translate "Parolni ko'rsatish" %}'"
            :aria-pressed="show ? 'true' : 'false'"
            aria-label="{% translate "Parolni ko'rsatish" %}">
      <span x-show="!show">{% icon "eye" 18 %}</span>
      <span x-show="show" x-cloak>{% icon "eye-off" 18 %}</span>
    </button>
  </div>
  {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
